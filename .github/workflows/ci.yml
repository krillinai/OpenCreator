name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm release:verify-scheduled-task-upgrade
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm smoke:ci
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf:measure
      - run: pnpm perf:check
        env:
          OPENCREATOR_PERFORMANCE_RESULTS_REQUIRED: '1'
      - run: pnpm audit --audit-level high
