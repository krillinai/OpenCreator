name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  osv:
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        -r
        ./

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 校验 Desktop 发布标签
        if: startsWith(github.ref, 'refs/tags/')
        run: node apps/desktop/scripts/verify-desktop-release-tag.mjs "${{ github.ref_name }}"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  package:
    needs:
      - osv
      - verify
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            platform: darwin
            arch: x64
          - name: macos-arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      OPENCREATOR_DESKTOP_CACHE_DIR: ${{ github.workspace }}/apps/desktop/.cache
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            apps/desktop/.cache/electron
            apps/desktop/.cache/electron-builder
            apps/desktop/.cache/codex-runtime
            apps/desktop/.cache/node-gyp
            apps/desktop/.cache/npm
            .runtime/vendor/creator-runtime/${{ matrix.platform }}-${{ matrix.arch }}
          key: desktop-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/package.json', 'apps/desktop/scripts/install-creator-runtime-dependencies.mjs', 'resources/codex-runtime/**/manifest.json') }}
      - name: Windows 全量测试
        if: matrix.platform == 'win32'
        run: pnpm test
      - name: Windows 类型检查
        if: matrix.platform == 'win32'
        run: pnpm typecheck
      - run: pnpm desktop:release
        env:
          OPENCREATOR_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
          OPENCREATOR_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - name: 验证实际打包应用
        run: pnpm --filter @opencreator/desktop e2e:package
      - uses: actions/upload-artifact@v4
        with:
          name: opencreator-desktop-${{ matrix.name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
            apps/desktop/release/opencreator-desktop-build-manifest.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 整理发布资产
        shell: bash
        run: |
          while IFS= read -r -d '' manifest; do
            artifact_name="$(basename "$(dirname "$manifest")")"
            mv "$manifest" "$(dirname "$manifest")/${artifact_name}-build-manifest.json"
          done < <(find artifacts -type f -name opencreator-desktop-build-manifest.json -print0)
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          find artifacts -type f -print0 | xargs -0 gh release upload "$TAG" --clobber
